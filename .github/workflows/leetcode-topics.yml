name: Auto Generate Structured LeetCode Topics

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Topics Section
        run: |
          echo "<!---LeetCode Topics Start-->" > generated.md
          echo "# LeetCode Topics" >> generated.md

          python3 <<EOF
import json

repo = "${{ github.repository }}"
with open("topics.json") as f:
    data = json.load(f)

with open("generated.md", "a") as out:
    for topic, problems in data.items():
        out.write(f"## {topic}\n")
        out.write("|  |\n")
        out.write("| ------- |\n")
        for p in problems:
            out.write(f"| [{p}](https://github.com/{repo}/tree/main/{p}) |\n")
EOF

          echo "<!---LeetCode Topics End-->" >> generated.md

      - name: Replace Section in README
        run: |
          awk '
          BEGIN{inside=0}
          /<!---LeetCode Topics Start-->/ {inside=1; next}
          /<!---LeetCode Topics End-->/ {inside=0; next}
          !inside {print}
          ' README.md > temp.md

          cat temp.md generated.md > README_NEW.md
          mv README_NEW.md README.md

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Auto-update structured LeetCode topics" || exit 0
          git push